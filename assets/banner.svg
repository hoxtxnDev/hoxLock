<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#121829" />
      <stop offset="85%" stop-color="#1a153b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="chileRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for neon glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGradient)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect width="1200" height="340" rx="20" fill="url(#glowLeft)" />
  <rect width="1200" height="340" rx="20" fill="url(#glowRight)" />

  <!-- Subtle Cyber Grid -->
  <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
  <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
  <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
  <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="340" class="grid-line" />
  <line x1="450" y1="0" x2="450" y2="340" class="grid-line" />
  <line x1="750" y1="0" x2="750" y2="340" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line" />

  <!-- Decorative lock icon / shield on the left -->
  <g transform="translate(80, 80)">
    <!-- Hexagonal glowing shield base -->
    <polygon points="65,10 120,40 120,110 65,145 10,110 10,40" fill="#0f172a" fill-opacity="0.8" stroke="url(#primaryGrad)" stroke-width="2.5" />
    <polygon points="65,18 112,44 112,104 65,135 18,104 18,44" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />

    <!-- Padlock Graphic inside Shield -->
    <!-- Shackle -->
    <path d="M47,68 L47,54 C47,44 55,36 65,36 C75,36 83,44 83,54 L83,68" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="40" y="66" width="50" height="42" rx="7" fill="url(#primaryGrad)" />
    <!-- Keyhole -->
    <circle cx="65" cy="83" r="4.5" fill="#0f172a" />
    <path d="M63,85 L67,85 L69,96 L61,96 Z" fill="#0f172a" />
  </g>

  <!-- Typography Header: hoxLock -->
  <g transform="translate(240, 115)">
    <!-- Brand Title -->
    <text x="0" y="30" class="brand-title" fill="url(#primaryGrad)">hoxLock</text>
    <text x="260" y="30" class="brand-title" fill="#f8fafc">⚡</text>

    <!-- Subtitle -->
    <text x="0" y="68" class="brand-sub">Generador automatizado de contraseñas de alta entropía &amp; hashes Argon2id</text>
  </g>

  <!-- Badge Pill 1: OsRng + Argon2id -->
  <g transform="translate(240, 220)">
    <rect width="215" height="42" rx="21" fill="url(#pillBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#38bdf8" />
    <text x="38" y="26" class="badge-text">OsRng + Argon2id</text>
  </g>

  <!-- Badge Pill 2: Ejecución Ultrarrápida -->
  <g transform="translate(470, 220)">
    <rect width="195" height="42" rx="21" fill="url(#pillBg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="20" y="26" class="badge-text">⚡ 1-Step (&lt; 0.2s)</text>
  </g>

  <!-- Badge Pill 3: Bandera Chilena / Hecho en Chile -->
  <g transform="translate(680, 220)">
    <rect width="210" height="42" rx="21" fill="url(#pillBg)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2" />
    
    <!-- Bandera de Chile (SVG vector exacto) -->
    <g transform="translate(18, 12)">
      <clipPath id="chileClip">
        <rect width="27" height="18" rx="3" />
      </clipPath>
      <g clip-path="url(#chileClip)">
        <!-- Franja inferior roja -->
        <rect x="0" y="9" width="27" height="9" fill="#D52B1E" />
        <!-- Franja superior derecha blanca -->
        <rect x="9" y="0" width="18" height="9" fill="#FFFFFF" />
        <!-- Cantón superior izquierdo azul -->
        <rect x="0" y="0" width="9" height="9" fill="#0039A6" />
        <!-- Estrella solitaria de 5 puntas centrada en cantón (cx=4.5, cy=4.5) -->
        <polygon points="4.5,1.8 5.16,3.59 7.07,3.67 5.58,4.85 6.09,6.68 4.5,5.63 2.91,6.68 3.42,4.85 1.93,3.67 3.84,3.59" fill="#FFFFFF" />
      </g>
    </g>

    <text x="56" y="26" class="badge-text">Hecho en Chile 🇨🇱</text>
  </g>

  <!-- Badge Pill 4: Open Source MIT -->
  <g transform="translate(905, 220)">
    <rect width="185" height="42" rx="21" fill="url(#pillBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="38" y="26" class="badge-text">Open Source (MIT)</text>
  </g>
</svg>
